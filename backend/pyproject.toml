[project]
name = "zenshine-assistant-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "C4"]
ignore = ["S101", "S110", "S311", "B008", "UP037", "UP017", "RUF012", "RUF001", "RUF002", "RUF003", "SIM105", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["app"]
