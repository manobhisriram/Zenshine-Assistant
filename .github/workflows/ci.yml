name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: zenshine-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=development -e ANTHROPIC_API_KEY=ci -e PINECONE_API_KEY=ci -e AUTO_INGEST=false \
            zenshine-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break || sleep 1; done
          curl -fsS localhost:8000/v1/config | grep -q '"brand"'
          docker rm -f api
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zenshine-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
