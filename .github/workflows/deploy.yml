name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # OIDC to AWS: no stored AWS keys
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # "dev" deploys automatically on main; "prod" is selected manually and gated by the environment's required reviewers.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX || 'zenshine' }}
      RESOURCE_NAME: ${{ vars.RESOURCE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve names
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "TAG=$SHA" >> "$GITHUB_ENV"
          NAME="${RESOURCE_NAME:-${NAME_PREFIX}-${ENVIRONMENT}}"
          echo "CLUSTER=${NAME}" >> "$GITHUB_ENV"
          echo "FAMILY=${NAME}-api" >> "$GITHUB_ENV"
          echo "REPO=${NAME}-api" >> "$GITHUB_ENV"

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this commit's image already exists (ECR tags are immutable)
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - name: Build and push image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render new task definition
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > taskdef.json
          jq --arg img "${{ steps.ecr.outputs.registry }}/${REPO}:${TAG}" --arg ver "$TAG" '
            .containerDefinitions[0].image = $img
            | (.containerDefinitions[0].environment |= map(if .name=="APP_VERSION" then .value=$ver else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' taskdef.json > taskdef.new.json

      - name: Deploy API (rolling, with circuit-breaker rollback)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: taskdef.new.json
          cluster: ${{ env.CLUSTER }}
          service: api
          wait-for-service-stability: true
          wait-for-minutes: 15

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and publish frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/"

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 12); do
            curl -fsS "${{ vars.PUBLIC_URL }}/v1/config" | grep -q '"brand"' && exit 0
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1
